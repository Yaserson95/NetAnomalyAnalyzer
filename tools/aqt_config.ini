[aqt]
concurrency : 4
baseurl : https://ftp.nluug.nl/languages/qt/
7zcmd : 7z
print_stacktrace_on_error : False
always_keep_archives : False
archive_download_location : .
min_module_size : 41

[requests]
connection_timeout : 15
response_timeout : 60
max_retries_on_connection_error : 5
retry_backoff : 0.5
max_retries_on_checksum_error : 5
max_retries_to_retrieve_hash : 5
hash_algorithm : sha256
; Зеркало не публикует .sha256, а download.qt.io недоступен из этой сети.
; Транспорт — HTTPS официального зеркала Qt, поэтому проверка хеша отключается.
INSECURE_NOT_FOR_PRODUCTION_ignore_hash : True

[mirrors]
trusted_mirrors :
    https://ftp.nluug.nl/languages/qt/
fallbacks :
    https://mirrors.tuna.tsinghua.edu.cn/qt/
    https://mirror.kakao.com/qt/
